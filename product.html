<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Продукт — 420 Beans</title>
  <meta name="description" content="Специалти кафе от 420 Beans">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="announcement-bar">
  <span data-i18n="announcementBar">Прясно изпечено кафе • Доставка с куриер • Поръчай сега →</span>
</div>

<nav class="nav" id="main-nav">
  <div class="container">
    <div class="nav-inner">
      <a href="/" class="nav-logo">420 <span>Beans</span></a>
      <div class="nav-links">
        <a href="/shop" class="nav-link" data-i18n="shopCoffee">Разгледай кафетата</a>
      </div>
      <div class="nav-actions">
        <button class="nav-lang lang-toggle">EN</button>
        <div class="nav-cart-wrap">
          <button class="nav-btn" data-cart-open aria-label="Количка">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span class="cart-count" style="display:none">0</span>
          </button>
        </div>
        <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      </div>
    </div>
  </div>
</nav>

<nav class="mobile-nav" id="mobile-nav">
  <a href="/shop" class="mobile-nav-link" data-i18n="shopCoffee">Разгледай кафетата</a>
</nav>

<main>
  <div class="container">
    <div style="padding:var(--sp-6) 0">
      <a href="/shop" style="font-size:var(--text-sm);color:var(--text-muted);display:inline-flex;align-items:center;gap:var(--sp-2)">
        ← <span data-i18n="shopCoffee">Разгледай кафетата</span>
      </a>
    </div>
    <div class="product-detail" id="product-detail">
      <!-- Loaded by JS -->
      <div class="skeleton" style="aspect-ratio:1;border-radius:var(--r-lg)"></div>
      <div style="display:flex;flex-direction:column;gap:var(--sp-4)">
        <div class="skeleton skel-line" style="width:40%"></div>
        <div class="skeleton skel-title" style="height:36px;width:80%"></div>
        <div class="skeleton skel-line"></div>
        <div class="skeleton skel-line" style="width:75%"></div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <p class="footer-copy">© 2024 420 Beans. Всички права запазени.</p>
    </div>
  </div>
</footer>

<!-- Cart Drawer -->
<div class="cart-overlay" id="cart-overlay"></div>
<aside class="cart-drawer" id="cart-drawer" role="dialog" aria-label="Количка" aria-modal="true">
  <div class="cart-header">
    <h2 class="cart-title">Количка</h2>
    <button class="cart-close" data-cart-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-totals">
      <div class="cart-row"><span>Стойност</span><span id="cart-subtotal">€0.00</span></div>
      <div class="cart-row"><span>Доставка</span><span id="cart-shipping">€4.99</span></div>
      <div class="cart-row total"><span>Общо</span><span id="cart-total">€0.00</span></div>
    </div>
    <button class="btn btn-primary btn-full btn-lg" id="checkout-btn">Към плащане</button>
  </div>
</aside>

<!-- Chat -->
<button class="chat-fab" id="chat-fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
<div class="chat-panel" id="chat-panel">
  <div class="chat-panel-header">
    <div class="chat-avatar">☕</div>
    <div><div class="chat-panel-title">Кафе Асистент</div></div>
    <button id="chat-close" style="margin-left:auto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <form class="chat-form" id="chat-form">
    <input class="chat-input" id="chat-input" type="text" placeholder="Попитай за кафе...">
    <button class="chat-send" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </form>
</div>
<div class="toast-stack" id="toast-stack"></div>

<script src="/app.js"></script>
<script>
let CURRENT_PRODUCT = null;
let SELECTED_SIZE = '250g';
let QTY = 1;

const SIZE_PRICE_MAP = {
  '250g': 'price_250',
  '500g': 'price_500',
  '1kg':  'price_1000',
};

function getPrice(p, size) {
  return Number(p[SIZE_PRICE_MAP[size]] || p.price || 0);
}

function roastLevel(label) {
  const map = { light: 25, 'light-medium': 38, medium: 50, 'medium-dark': 65, dark: 80 };
  const l = (label || '').toLowerCase().replace(/\s+/g, '-');
  return map[l] || 50;
}

function renderProduct(p) {
  const name = STATE.lang === 'bg' ? (p.name_bg || p.name) : (p.name_en || p.name);
  const origin = STATE.lang === 'bg' ? (p.origin_bg || p.origin || '') : (p.origin_en || p.origin || '');
  const desc = STATE.lang === 'bg' ? (p.description_bg || p.description || '') : (p.description_en || p.description || '');
  const notes = STATE.lang === 'bg' ? (p.notes_bg || p.flavor_notes_bg || p.notes || '') : (p.notes_en || p.flavor_notes_en || '');
  const process = STATE.lang === 'bg' ? (p.process_bg || p.process || '') : (p.process_en || p.process || '');
  const roast = STATE.lang === 'bg' ? (p.roast_bg || p.roast_level_bg || '') : (p.roast_en || p.roast_level_en || '');
  const elevation = p.elevation || '';
  const variety = p.variety || '';
  const price = getPrice(p, SELECTED_SIZE);
  const pct = roastLevel(p.roast_level_en || p.roast_en || 'medium');
  const noteList = notes.split(/[,·\n]/).map(s => s.trim()).filter(Boolean);

  document.title = `${name} — 420 Beans`;

  const hasSizes = p.price_500 || p.price_1000;

  const detail = document.getElementById('product-detail');
  detail.innerHTML = `
    <div>
      <div class="product-gallery-main">
        ${p.image_url
          ? `<img src="${p.image_url}" alt="${name}" loading="eager">`
          : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:6rem;background:var(--bg-alt)">☕</div>`
        }
      </div>
    </div>
    <div>
      <p style="font-family:var(--font-mono);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:var(--sp-2)">${origin}</p>
      <h1 style="font-family:var(--font-display);font-size:clamp(var(--text-3xl),4vw,var(--text-4xl));font-weight:700;letter-spacing:-.025em;line-height:1.1;margin-bottom:var(--sp-4)">${name}</h1>
      ${desc ? `<p style="color:var(--text-muted);font-size:var(--text-lg);line-height:1.65;margin-bottom:var(--sp-4)">${desc}</p>` : ''}

      ${noteList.length ? `<div class="product-notes" style="margin-bottom:var(--sp-4)">${noteList.map(n => `<span class="note-tag">${n}</span>`).join('')}</div>` : ''}

      <!-- Roast bar -->
      ${roast ? `<div class="roast-bar-wrap">
        <div class="roast-bar-label"><span>Светло</span><span>${roast}</span><span>Тъмно</span></div>
        <div class="roast-bar-track"><div class="roast-bar-fill" style="width:${pct}%"></div></div>
      </div>` : ''}

      <!-- Meta grid -->
      <div class="product-meta-grid">
        ${origin ? `<div class="product-meta-item"><div class="product-meta-label" data-i18n="origin">Произход</div><div class="product-meta-value">${origin}</div></div>` : ''}
        ${process ? `<div class="product-meta-item"><div class="product-meta-label" data-i18n="process">Обработка</div><div class="product-meta-value">${process}</div></div>` : ''}
        ${elevation ? `<div class="product-meta-item"><div class="product-meta-label" data-i18n="elevation">Надм. вис.</div><div class="product-meta-value">${elevation}</div></div>` : ''}
        ${variety ? `<div class="product-meta-item"><div class="product-meta-label" data-i18n="variety">Сорт</div><div class="product-meta-value">${variety}</div></div>` : ''}
      </div>

      <!-- Size selector -->
      ${hasSizes ? `<div>
        <p style="font-family:var(--font-mono);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:var(--sp-3)">Количество</p>
        <div class="size-selector">
          <button class="size-btn active" data-size="250g" onclick="selectSize('250g',this)">
            250g <span class="price">€${Number(p.price_250||p.price||0).toFixed(2)}</span>
          </button>
          ${p.price_500 ? `<button class="size-btn" data-size="500g" onclick="selectSize('500g',this)">500g <span class="price">€${Number(p.price_500).toFixed(2)}</span></button>` : ''}
          ${p.price_1000 ? `<button class="size-btn" data-size="1kg" onclick="selectSize('1kg',this)">1 kg <span class="price">€${Number(p.price_1000).toFixed(2)}</span></button>` : ''}
        </div>
      </div>` : ''}

      <!-- Price & Qty -->
      <div class="product-price-big" id="product-price">€${price.toFixed(2)}</div>

      <div class="qty-row">
        <div class="qty-control">
          <button onclick="changeQty(-1)">−</button>
          <input type="number" id="qty-input" value="1" min="1" max="20" readonly>
          <button onclick="changeQty(1)">+</button>
        </div>
        <button class="btn btn-primary btn-lg" style="flex:1" id="add-btn" onclick="addToCartDetail()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span data-i18n="addToCart">Добави в количка</span>
        </button>
      </div>
    </div>
  `;
  applyLang();
}

function selectSize(size, btn) {
  SELECTED_SIZE = size;
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const price = getPrice(CURRENT_PRODUCT, SELECTED_SIZE);
  const el = document.getElementById('product-price');
  if (el) el.textContent = `€${price.toFixed(2)}`;
}

function changeQty(delta) {
  QTY = Math.max(1, Math.min(20, QTY + delta));
  const el = document.getElementById('qty-input');
  if (el) el.value = QTY;
}

function addToCartDetail() {
  if (!CURRENT_PRODUCT) return;
  const price = getPrice(CURRENT_PRODUCT, SELECTED_SIZE);
  for (let i = 0; i < QTY; i++) cartAdd(CURRENT_PRODUCT, SELECTED_SIZE, price);
  const btn = document.getElementById('add-btn');
  if (btn) {
    btn.textContent = t('addedToCart');
    btn.classList.add('added');
    setTimeout(() => { btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span>${t('addToCart')}</span>`; btn.classList.remove('added'); }, 1800);
  }
  openCart();
}

async function loadProduct() {
  const slug = window.location.pathname.replace('/product/', '').split('/')[0];
  try {
    const res = await fetch('/api/products');
    const data = await res.json();
    STATE.products = Array.isArray(data) ? data : (data.products || []);
    CURRENT_PRODUCT = STATE.products.find(p => String(p.slug) === slug || String(p.id) === slug);
    if (CURRENT_PRODUCT) {
      renderProduct(CURRENT_PRODUCT);
    } else {
      document.getElementById('product-detail').innerHTML = '<p style="color:var(--text-muted)">Продуктът не е намерен. <a href="/shop">← Назад към магазина</a></p>';
    }
  } catch {
    document.getElementById('product-detail').innerHTML = '<p style="color:var(--text-muted)">Грешка при зареждане. Опитай пак.</p>';
  }
}

document.addEventListener('DOMContentLoaded', loadProduct);
</script>
</body>
</html>
