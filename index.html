<!DOCTYPE html>
<html lang="bg" data-lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>420 BEANS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700&family=JetBrains+Mono:wght@300;400;700&display=swap">
<style>
:root {
  --bg:     #03000A;
  --bg1:    #08040F;
  --bg2:    #0D0818;
  --fg:     #E8D5FF;
  --dim:    #5A4A7A;
  --dim2:   #2A1A3A;
  --lime:   #FF2CF7;
  --lime2:  rgba(255,44,247,.08);
  --lime3:  rgba(255,44,247,.04);
  --amber:  #FF9D00;
  --red:    #FF3A3A;
  --cyan:   #0FF4FF;
  --green:  #39FF14;
  --border: rgba(255,44,247,.1);
  --f-mono: 'JetBrains Mono', 'Space Mono', monospace;
  --ease:   cubic-bezier(.16,1,.3,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
::selection{background:var(--lime);color:#000;}
html{scroll-behavior:smooth;}

body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--f-mono);
  overflow-x:hidden;
  cursor:none;
  min-height:100vh;
}

/* ── CRT OVERLAY ────────────────────── */
body::after{
  content:'';
  position:fixed;inset:0;pointer-events:none;z-index:10000;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,.18) 2px,
      rgba(0,0,0,.18) 4px
    );
  mix-blend-mode:multiply;
}

/* ── NOISE ──────────────────────────── */
body::before{
  content:'';
  position:fixed;inset:0;pointer-events:none;z-index:9999;
  opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:200px 200px;
  animation: noise-anim 0.5s steps(1) infinite;
}
@keyframes noise-anim{
  0%{background-position:0 0;}
  20%{background-position:-40px 20px;}
  40%{background-position:30px -10px;}
  60%{background-position:-20px 40px;}
  80%{background-position:10px -30px;}
  100%{background-position:0 0;}
}

/* ── CURSOR ─────────────────────────── */
#cursor{
  position:fixed;width:4px;height:18px;
  background:var(--cyan);
  pointer-events:none;z-index:10001;
  transform:translate(-50%,-50%);
  box-shadow:0 0 8px var(--cyan),0 0 20px rgba(15,244,255,.4);
  transition:transform .08s;
}
#cursor-ring{
  position:fixed;width:28px;height:28px;
  border:1px solid var(--lime);
  pointer-events:none;z-index:10001;
  transform:translate(-50%,-50%);
  opacity:.5;
  box-shadow:0 0 6px rgba(255,44,247,.3);
  transition:all .18s var(--ease);
}

/* ── TOPBAR ─────────────────────────── */
#topbar{
  position:fixed;top:0;left:0;right:0;
  z-index:200;
  height:44px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
  border-bottom:1px solid rgba(255,44,247,.15);
  background:rgba(3,0,10,.95);
  backdrop-filter:blur(12px);
  box-shadow:0 1px 0 rgba(255,44,247,.08), 0 0 30px rgba(255,44,247,.04);
}
.tb-logo{
  font-size:14px;letter-spacing:.25em;
  color:var(--lime);
  text-decoration:none;
  font-weight:700;
  text-shadow:0 0 12px rgba(255,44,247,.7),0 0 30px rgba(255,44,247,.3);
}
.tb-logo em{color:var(--dim);font-style:normal;}
.tb-nav{display:flex;gap:0;align-items:center;}
.tb-link{
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim);text-decoration:none;
  padding:0 16px;height:44px;
  display:flex;align-items:center;
  border-right:1px solid rgba(255,44,247,.08);
  transition:color .15s,text-shadow .15s;
  cursor:none;
  position:relative;
}
.tb-link:first-child{border-left:1px solid rgba(255,44,247,.08);}
.tb-link::after{
  content:'';
  position:absolute;bottom:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg,var(--cyan),var(--lime));
  transform:scaleX(0);
  transition:transform .2s var(--ease);
  box-shadow:0 0 8px var(--cyan);
}
.tb-link:hover,.tb-link.active{color:var(--fg);text-shadow:0 0 10px rgba(255,44,247,.5);}
.tb-link:hover::after,.tb-link.active::after{transform:scaleX(1);}
.tb-right{display:flex;align-items:center;gap:0;}
.tb-lang{
  font-size:10px;letter-spacing:.15em;color:var(--dim);
  background:none;border:none;
  padding:0 12px;height:44px;
  cursor:none;transition:color .15s,text-shadow .15s;
}
.tb-lang:hover,.tb-lang.active{color:var(--cyan);text-shadow:0 0 8px rgba(15,244,255,.6);}
.tb-cart{
  height:44px;padding:0 18px;
  border-left:1px solid rgba(255,44,247,.08);
  background:none;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.15em;
  color:var(--dim);cursor:none;
  transition:color .15s,text-shadow .15s;
  display:flex;align-items:center;gap:8px;
}
.tb-cart:hover{color:var(--lime);text-shadow:0 0 10px rgba(255,44,247,.5);}
.cart-badge{
  background:var(--lime);color:#000;
  font-size:8px;font-weight:700;
  width:14px;height:14px;border-radius:0;
  display:none;align-items:center;justify-content:center;
  box-shadow:0 0 8px rgba(255,44,247,.8);
}

/* ── MAIN LAYOUT ────────────────────── */
#main{
  min-height:100vh;
  padding:82px 0 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

/* grid */
#main::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,44,247,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(15,244,255,.03) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black,transparent);
  z-index:0;
}

/* radial glow bg */
#main::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 30% 60%, rgba(255,44,247,.06), transparent),
    radial-gradient(ellipse 50% 40% at 70% 40%, rgba(15,244,255,.05), transparent);
  z-index:0;
}

/* ── TERMINAL WINDOW ────────────────── */
#term-wrap{
  position:relative;z-index:2;
  width:min(760px,92vw);
  margin:0 auto;
}

.term-window{
  background:rgba(5,2,12,.96);
  border:1px solid rgba(255,44,247,.25);
  box-shadow:
    0 0 0 1px rgba(15,244,255,.06),
    0 0 40px rgba(255,44,247,.12),
    0 0 80px rgba(255,44,247,.06),
    0 0 120px rgba(15,244,255,.04),
    0 32px 100px rgba(0,0,0,.9);
  position:relative;
}
.term-window::before{
  content:'';position:absolute;top:-1px;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,var(--cyan),var(--lime),var(--cyan));
  opacity:.7;
}

/* titlebar */
.term-bar{
  display:flex;align-items:center;
  padding:0 16px;
  height:36px;
  border-bottom:1px solid rgba(255,44,247,.12);
  background:rgba(255,44,247,.04);
  gap:8px;
}
.term-dot{width:10px;height:10px;border-radius:50%;}
.term-dot.r{background:#ff5f57;box-shadow:0 0 6px #ff5f57;}
.term-dot.y{background:#febc2e;box-shadow:0 0 6px #febc2e;}
.term-dot.g{background:#28c840;box-shadow:0 0 6px #28c840;}
.term-title{
  flex:1;text-align:center;
  font-size:10px;letter-spacing:.2em;color:var(--dim);
  text-shadow:0 0 10px rgba(255,44,247,.3);
}

/* body */
.term-body{
  height:420px;
  overflow-y:auto;
  padding:20px 24px;
  scrollbar-width:thin;
  scrollbar-color:var(--dim2) transparent;
  position:relative;
}
.term-body::-webkit-scrollbar{width:4px;}
.term-body::-webkit-scrollbar-track{background:transparent;}
.term-body::-webkit-scrollbar-thumb{background:var(--dim2);border-radius:2px;}

/* lines */
.t-line{
  font-size:12px;line-height:1.9;
  display:flex;gap:0;
  white-space:pre-wrap;word-break:break-word;
}
.t-line .prompt{color:var(--lime);margin-right:8px;flex-shrink:0;text-shadow:0 0 8px rgba(255,44,247,.6);}
.t-line .cmd{color:var(--fg);}
.t-line.output .cmd{color:rgba(232,213,255,.6);margin-left:20px;}
.t-line.header .cmd{color:var(--amber);font-weight:700;margin-left:20px;text-shadow:0 0 12px rgba(255,157,0,.5);}
.t-line.success .cmd{color:var(--green);margin-left:20px;text-shadow:0 0 8px rgba(57,255,20,.5);}
.t-line.err .cmd{color:var(--red);margin-left:20px;text-shadow:0 0 8px rgba(255,58,58,.4);}
.t-line.info .cmd{color:var(--cyan);margin-left:20px;text-shadow:0 0 8px rgba(15,244,255,.5);}
.t-line.gap{height:10px;}
.t-line.link-line .cmd{
  color:var(--cyan);cursor:none;
  margin-left:20px;
  transition:color .15s,text-shadow .15s;
  text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:rgba(15,244,255,.3);
  text-shadow:0 0 6px rgba(15,244,255,.4);
}
.t-line.link-line:hover .cmd{color:var(--lime);text-shadow:0 0 10px rgba(255,44,247,.6);}

/* input row */
.term-input-row{
  display:flex;align-items:center;gap:8px;
  padding:12px 24px 16px;
  border-top:1px solid rgba(255,44,247,.1);
  background:rgba(255,44,247,.02);
}
.term-prompt-label{
  color:var(--lime);font-size:12px;flex-shrink:0;
  text-shadow:0 0 10px rgba(255,44,247,.7);
}
.term-input{
  flex:1;
  background:none;border:none;outline:none;
  font-family:var(--f-mono);font-size:12px;
  color:var(--fg);caret-color:var(--cyan);
  letter-spacing:.03em;
}
.term-input::placeholder{color:var(--dim2);}
.term-cursor-blink{
  width:2px;height:16px;
  background:var(--cyan);
  flex-shrink:0;
  box-shadow:0 0 8px var(--cyan),0 0 16px rgba(15,244,255,.4);
  animation:blink .8s step-end infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* ── BELOW TERM ─────────────────────── */
#hints{
  position:relative;z-index:2;
  margin-top:20px;
  display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
}
.hint-tag{
  font-size:9px;letter-spacing:.18em;color:var(--dim);
  border:1px solid rgba(255,44,247,.15);padding:5px 12px;
  cursor:none;transition:color .15s,border-color .15s,box-shadow .15s,background .15s;
  background:rgba(255,44,247,.03);
}
.hint-tag:hover{
  color:var(--cyan);
  border-color:rgba(15,244,255,.4);
  background:rgba(15,244,255,.05);
  box-shadow:0 0 12px rgba(15,244,255,.15);
}
.hint-tag span{color:var(--lime);text-shadow:0 0 8px rgba(255,44,247,.5);}

/* ── PAGES (hidden sections) ────────── */
.page{display:none;}
.page.active{display:block;}

/* ── CART DRAWER ────────────────────── */
#cart-drawer{
  position:fixed;right:0;top:0;bottom:0;width:380px;
  background:var(--bg1);border-left:1px solid var(--border);
  z-index:300;
  transform:translateX(100%);
  transition:transform .3s var(--ease);
  display:flex;flex-direction:column;
}
#cart-drawer.open{transform:translateX(0);}
.drawer-bar{
  padding:0 24px;height:42px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.drawer-bar-title{font-size:10px;letter-spacing:.2em;color:var(--dim);}
.drawer-close{background:none;border:none;color:var(--dim);font-size:18px;cursor:none;transition:color .15s;}
.drawer-close:hover{color:var(--fg);}
.drawer-items{flex:1;overflow-y:auto;padding:20px 24px;}
.drawer-empty{font-size:11px;color:var(--dim);padding-top:32px;}
.drawer-footer{padding:20px 24px;border-top:1px solid var(--border);}
.drawer-total{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:16px;}
.drawer-total span:last-child{color:var(--fg);font-weight:700;}
.checkout-btn{
  width:100%;background:var(--lime);color:#000;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;padding:14px;border:none;cursor:none;
  transition:opacity .15s;
}
.checkout-btn:hover{opacity:.85;}
.cart-item{
  display:grid;grid-template-columns:1fr auto;
  gap:12px;padding:14px 0;
  border-bottom:1px solid var(--border);
}
.cart-item-name{font-size:12px;font-weight:600;margin-bottom:3px;}
.cart-item-meta{font-size:9px;color:var(--dim);letter-spacing:.1em;}
.cart-item-price{font-size:12px;color:var(--lime);}

/* ── OVERLAY ────────────────────────── */
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  backdrop-filter:blur(4px);z-index:250;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
#overlay.show{opacity:1;pointer-events:all;}

/* ── TOAST ──────────────────────────── */
#toast{
  position:fixed;bottom:32px;left:50%;
  transform:translateX(-50%) translateY(12px);
  background:var(--bg1);border:1px solid rgba(57,255,20,.3);
  font-size:11px;letter-spacing:.12em;
  padding:10px 20px;z-index:400;
  opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── NEON MARQUEE ──────────────────────── */
#neon-strip{
  position:fixed;
  top:44px;left:0;right:0;
  z-index:190;
  height:38px;
  overflow:hidden;
  background:rgba(3,0,10,.97);
  border-bottom:1px solid rgba(255,44,247,.15);
  display:flex;align-items:center;
  box-shadow:inset 0 -1px 0 rgba(15,244,255,.08);
}
#neon-track{
  display:flex;
  gap:0;
  white-space:nowrap;
  animation: marquee-run 28s linear infinite;
  will-change:transform;
}
@keyframes marquee-run{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}
.neon-item{
  display:inline-flex;
  align-items:center;
  gap:0;
  padding:0 36px;
  border-right:1px solid rgba(255,44,247,.1);
  height:38px;
  position:relative;
}
.neon-name{
  font-family:'JetBrains Mono','Space Mono',monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:#FF2CF7;
  text-shadow:
    0 0 2px #fff,
    0 0 6px #FF2CF7,
    0 0 14px #FF2CF7,
    0 0 28px rgba(255,44,247,.6),
    0 0 50px rgba(255,44,247,.3);
  position:relative;
}
.neon-name::after{
  content:attr(data-text);
  position:absolute;inset:0;
  color:transparent;
  background-image:radial-gradient(circle,rgba(0,0,0,.55) 1px,transparent 1px);
  background-size:3px 3px;
  -webkit-background-clip:text;
  background-clip:text;
  letter-spacing:.32em;
  pointer-events:none;
}
.neon-sep{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:rgba(15,244,255,.5);
  letter-spacing:.1em;
  margin:0 4px;
  text-shadow:0 0 6px rgba(15,244,255,.6);
}
.neon-price{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  letter-spacing:.2em;
  color:rgba(15,244,255,.8);
  margin-left:10px;
  text-shadow:0 0 8px rgba(15,244,255,.5);
}
#neon-strip:hover #neon-track{animation-play-state:paused;}

/* ── MOBILE ─────────────────────────── */
@media(max-width:600px){
  #topbar{padding:0 16px;}
  .tb-nav .tb-link{padding:0 10px;font-size:9px;}
  .term-body{height:300px;}
  #hints{gap:12px;}
}
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>
<div id="overlay"></div>
<div id="toast"></div>

<!-- ─── TOPBAR ──────────────────────── -->
<header id="topbar">
  <a href="/" class="tb-logo">420<em>_</em>BEANS</a>
  <nav class="tb-nav">
    <a href="#" class="tb-link" data-cmd="ls shop" data-en="SHOP" data-bg-txt="МАГАЗИН">МАГАЗИН</a>
    <a href="#" class="tb-link" data-cmd="ls origins" data-en="ORIGINS" data-bg-txt="ПРОИЗХОД">ПРОИЗХОД</a>
    <a href="#" class="tb-link" data-cmd="ls blog" data-en="BLOG" data-bg-txt="БЛОГ">БЛОГ</a>
    <a href="#" class="tb-link" data-cmd="about" data-en="ABOUT" data-bg-txt="ЗА НАС">ЗА НАС</a>
  </nav>
  <div class="tb-right">
    <button class="tb-lang active" data-l="bg">BG</button>
    <button class="tb-lang" data-l="en">EN</button>
    <button class="tb-cart" id="cartBtn">
      <span data-en="CART" data-bg-txt="КОШНИЦА">КОШНИЦА</span>
      <span class="cart-badge" id="cartCount">0</span>
    </button>
  </div>
</header>

<!-- ─── NEON MARQUEE ───────────────────── -->
<div id="neon-strip">
  <div id="neon-track"></div>
</div>

<!-- ─── MAIN ────────────────────────── -->
<main id="main">
  <div id="term-wrap">

    <div class="term-window">
      <div class="term-bar">
        <div class="term-dot r"></div>
        <div class="term-dot y"></div>
        <div class="term-dot g"></div>
        <div class="term-title">420beans — bash — 80×24</div>
      </div>

      <div class="term-body" id="termBody"></div>

      <div class="term-input-row">
        <span class="term-prompt-label">~/420beans $</span>
        <input type="text" class="term-input" id="termInput" autocomplete="off" spellcheck="false"
          placeholder="type a command or press ↑↓ to browse...">
        <div class="term-cursor-blink"></div>
      </div>
    </div>

    <div id="hints">
      <div class="hint-tag" data-cmd="ls shop"><span>ls</span> shop</div>
      <div class="hint-tag" data-cmd="ls origins"><span>ls</span> origins</div>
      <div class="hint-tag" data-cmd="ls blog"><span>ls</span> blog</div>
      <div class="hint-tag" data-cmd="about"><span>about</span></div>
      <div class="hint-tag" data-cmd="help"><span>help</span></div>
      <div class="hint-tag" data-cmd="cart"><span>cart</span></div>
    </div>
  </div>
</main>

<!-- ─── CART DRAWER ──────────────────── -->
<div id="cart-drawer">
  <div class="drawer-bar">
    <div class="drawer-bar-title" data-en="CART" data-bg-txt="КОШНИЦА">КОШНИЦА</div>
    <button class="drawer-close" id="cartClose">×</button>
  </div>
  <div class="drawer-items" id="cartItems">
    <div class="drawer-empty" data-en="Empty." data-bg-txt="Празна.">Празна.</div>
  </div>
  <div class="drawer-footer">
    <div class="drawer-total">
      <span data-en="TOTAL" data-bg-txt="ОБЩО">ОБЩО</span>
      <span id="cartTotal">€0.00</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn">CHECKOUT →</button>
  </div>
</div>

<script>
const CART_KEY = '420beans_cart_v2';
const LANG_KEY = '420b_lang';
let cart = [];
let lang = localStorage.getItem(LANG_KEY) || 'bg';
let cmdHistory = [];
let histIdx = -1;

// ── CURSOR ─────────────────────────────────
const cursor = document.getElementById('cursor');
const cursorRing = document.getElementById('cursor-ring');
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top  = e.clientY + 'px';
  setTimeout(() => {
    cursorRing.style.left = e.clientX + 'px';
    cursorRing.style.top  = e.clientY + 'px';
  }, 50);
});
document.addEventListener('mousedown', () => cursor.style.transform = 'translate(-50%,-50%) scale(1.8)');
document.addEventListener('mouseup',   () => cursor.style.transform = 'translate(-50%,-50%) scale(1)');

// ── TERMINAL ENGINE ────────────────────────
const body = document.getElementById('termBody');
const input = document.getElementById('termInput');

function line(type, prompt, text) {
  const d = document.createElement('div');
  d.className = 't-line ' + type;
  if (type === 'gap') { body.appendChild(d); scrollTerm(); return; }
  if (prompt) {
    const ps = document.createElement('span');
    ps.className = 'prompt';
    ps.textContent = prompt;
    d.appendChild(ps);
  }
  const ts = document.createElement('span');
  ts.className = 'cmd';
  ts.textContent = text;
  d.appendChild(ts);
  body.appendChild(d);
  scrollTerm();
}

function lineHTML(type, html) {
  const d = document.createElement('div');
  d.className = 't-line ' + type;
  const s = document.createElement('span');
  s.className = 'cmd';
  s.innerHTML = html;
  d.appendChild(s);
  body.appendChild(d);
  scrollTerm();
}

function scrollTerm() {
  requestAnimationFrame(() => { body.scrollTop = body.scrollHeight; });
}

async function typeIn(type, prompt, text, speed = 18) {
  const d = document.createElement('div');
  d.className = 't-line ' + type;
  if (prompt) {
    const ps = document.createElement('span');
    ps.className = 'prompt';
    ps.textContent = prompt;
    d.appendChild(ps);
  }
  const ts = document.createElement('span');
  ts.className = 'cmd';
  d.appendChild(ts);
  body.appendChild(d);

  for (const ch of text) {
    ts.textContent += ch;
    scrollTerm();
    await new Promise(r => setTimeout(r, speed + Math.random()*8));
  }
}

// ── COMMAND ROUTER ─────────────────────────
async function runCmd(raw) {
  const trimmed = raw.trim();
  if (!trimmed) return;
  line('output', '~/420beans $ ', trimmed);
  cmdHistory.unshift(trimmed); histIdx = -1;

  const parts = trimmed.toLowerCase().split(/\s+/);
  const base = parts[0];
  const arg1 = parts[1] || '';
  const rest = parts.slice(1).join(' ');

  if (base === 'help') { await cmd_help(); }
  else if (base === 'ls' && arg1 === 'shop') { await cmd_shop(); }
  else if (base === 'ls' && arg1 === 'origins') { await cmd_origins(); }
  else if (base === 'ls' && arg1 === 'blog') { await cmd_blog(); }
  else if (base === 'ls') { line('err', '', `ls: ${arg1 || '.'}: no such directory. Try: ls shop, ls origins, ls blog`); }
  else if (base === 'about') { await cmd_about(); }
  else if (base === 'cart') { await cmd_open_cart(); }
  else if (base === 'checkout') { await cmd_checkout(); }
  else if (base === 'clear' || base === 'cls') { await cmd_clear(); }
  else if (base === 'lang') { await cmd_lang(arg1); }
  else if (base === 'add' || (base === 'cart' && /^\d+$/.test(arg1))) { await cmd_add(arg1 || rest); }
  else if (/^\d+$/.test(trimmed)) { await cmd_add(trimmed); }
  else if (base === 'ask' || base === 'ai') { await cmd_ai(rest); }
  else if (base === 'shop') { await cmd_shop(); }
  else if (base === 'origins') { await cmd_origins(); }
  else if (base === 'blog') { await cmd_blog(); }
  else if (base === 'exit' || base === 'quit') { line('info', '', 'You cannot exit specialty coffee.'); }
  else {
    line('err', '', `command not found: ${trimmed}`);
    line('output', '', `Type "help" for available commands.`);
  }
}

// ── INPUT HANDLING ─────────────────────────
input.addEventListener('keydown', async e => {
  if (e.key === 'Enter') {
    const val = input.value;
    input.value = '';
    await runCmd(val);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < cmdHistory.length - 1) { histIdx++; input.value = cmdHistory[histIdx] || ''; }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; input.value = cmdHistory[histIdx] || ''; }
    else { histIdx = -1; input.value = ''; }
  }
});

document.getElementById('termBody').addEventListener('click', () => input.focus());

// ── CART ───────────────────────────────────
function loadCart() {
  try { cart = JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch { cart = []; }
}
function saveCart() { localStorage.setItem(CART_KEY, JSON.stringify(cart)); }
function addToCart(p) {
  loadCart();
  const ex = cart.find(i => i.slug === p.slug);
  if (ex) ex.qty++;
  else cart.push({ slug: p.slug, name: p.name_bg, price: p.price, qty: 1 });
  saveCart();
  updateCartUI();
  showToast(lang === 'bg' ? 'Добавено в кошницата' : 'Added to cart');
}
function updateCartUI() {
  loadCart();
  const total = cart.reduce((s,i) => s + i.price*i.qty, 0);
  const count = cart.reduce((s,i) => s + i.qty, 0);
  const badge = document.getElementById('cartCount');
  badge.textContent = count;
  badge.style.display = count > 0 ? 'flex' : 'none';
  document.getElementById('cartTotal').textContent = `€${total.toFixed(2)}`;
  const items = document.getElementById('cartItems');
  if (!cart.length) {
    items.innerHTML = `<div class="drawer-empty">${lang === 'bg' ? 'Празна.' : 'Empty.'}</div>`; return;
  }
  items.innerHTML = cart.map(i => `
    <div class="cart-item">
      <div>
        <div class="cart-item-name">${i.name}</div>
        <div class="cart-item-meta">250G · QTY ${i.qty}</div>
      </div>
      <div class="cart-item-price">€${(i.price*i.qty).toFixed(2)}</div>
    </div>
  `).join('');
}
document.getElementById('cartBtn').addEventListener('click', () => {
  document.getElementById('cart-drawer').classList.add('open');
  document.getElementById('overlay').classList.add('show');
  updateCartUI();
});
document.getElementById('cartClose').addEventListener('click', () => {
  document.getElementById('cart-drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
});
document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('cart-drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
});
document.getElementById('checkoutBtn').addEventListener('click', () => runCmd('checkout'));

}
