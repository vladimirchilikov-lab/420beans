backend:
  name: github
  repo: vladimirchilikov-lab/420beans
  branch: main
  base_url: https://420beans-auth.vladimir-chilikov.workers.dev

site_url: https://420beans.vercel.app
media_folder: "images"
public_folder: "/images"

collections:

  # ── ПРОДУКТИ ──────────────────────────────────────────────────────
  - name: "products"
    label: "☕ Продукти"
    files:
      - name: "all_products"
        label: "Всички продукти"
        file: "products.json"
        fields:
          - label: "Продукти"
            name: "products"
            widget: "list"
            summary: "{{fields.en.name}} — €{{fields.price}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - label: "Категория"
                name: "category"
                widget: "select"
                options:
                  - { label: "Кафе (Filter)", value: "filter" }
                  - { label: "Еспресо", value: "espresso" }
                  - { label: "Мърч", value: "merch" }
              - label: "Badge"
                name: "badge"
                widget: "select"
                required: false
                default: ""
                options:
                  - { label: "Няма", value: "" }
                  - { label: "Best Seller", value: "bestseller" }
                  - { label: "Ново", value: "new" }
              - { label: "Снимка", name: "image", widget: "image", required: false }
              - { label: "Цена в € (напр. 14.00)", name: "price", widget: "number", value_type: "float" }
              - { label: "Степен на печене (0–100)", name: "roast", widget: "number", value_type: "int", min: 0, max: 100, required: false, default: 50 }
              - { label: "Stripe Link", name: "stripeLink", widget: "string", required: false, default: "" }
              - label: "🇬🇧 Английски"
                name: "en"
                widget: "object"
                fields:
                  - { label: "Име", name: "name", widget: "string" }
                  - { label: "Регион / Печене / Процес (кратко)", name: "region", widget: "string" }
                  - { label: "Метод на обработка", name: "process", widget: "string", required: false }
                  - { label: "Вкусови бележки", name: "notes", widget: "string" }
              - label: "🇧🇬 Български"
                name: "bg"
                widget: "object"
                fields:
                  - { label: "Име", name: "name", widget: "string" }
                  - { label: "Регион / Печене / Процес (кратко)", name: "region", widget: "string" }
                  - { label: "Метод на обработка", name: "process", widget: "string", required: false }
                  - { label: "Вкусови бележки", name: "notes", widget: "string" }

  # ── ТЕКСТОВЕ НА САЙТА ─────────────────────────────────────────────
  - name: "texts"
    label: "✏️ Текстове на сайта"
    files:

      - name: "all_texts"
        label: "Всички текстове"
        file: "_data/texts.json"
        fields:

          # HERO
          - label: "🏠 Hero секция"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Малък надпис (EN)", name: "eyebrowEN", widget: "string", default: "Specialty Coffee — Est. 2024" }
              - { label: "Малък надпис (БГ)", name: "eyebrowBG", widget: "string", default: "Специалти Кафе — Осн. 2024" }
              - { label: "Описание (EN)", name: "descEN", widget: "text", default: "Carefully selected high-quality coffee, focused on flavour profile and traceable single-farm origin." }
              - { label: "Описание (БГ)", name: "descBG", widget: "text", default: "Подбираме внимателно висококачествено кафе с фокус върху вкусовия профил и проследим произход до конкретни ферми." }

          # ABOUT
          - label: "📖 За нас секция"
            name: "about"
            widget: "object"
            fields:
              - { label: "Заглавие секция (EN)", name: "labelEN", widget: "string", default: "Our Philosophy" }
              - { label: "Заглавие секция (БГ)", name: "labelBG", widget: "string", default: "Нашата философия" }
              - { label: "Heading (EN)", name: "headingEN", widget: "string", default: "Every cup tells a story." }
              - { label: "Heading (БГ)", name: "headingBG", widget: "string", default: "Всяка чаша разказва история." }
              - { label: "Основен текст (EN)", name: "bodyEN", widget: "text", default: "We carefully select high-quality coffee with a focus on flavour profile and traceable origin down to specific farms." }
              - { label: "Основен текст (БГ)", name: "bodyBG", widget: "text", default: "Подбираме внимателно висококачествено кафе с фокус върху вкусовия профил и проследим произход до конкретни ферми." }
              - { label: "Квадрат 1 (EN)", name: "stat1EN", widget: "string", default: "Interesting Process Methods" }
              - { label: "Квадрат 1 (БГ)", name: "stat1BG", widget: "string", default: "Интересни Методи на обработка" }
              - { label: "Квадрат 2 (EN)", name: "stat2EN", widget: "string", default: "Unique Flavour Profiles" }
              - { label: "Квадрат 2 (БГ)", name: "stat2BG", widget: "string", default: "Уникални Вкусови профили" }
              - { label: "Квадрат 3 (EN)", name: "stat3EN", widget: "string", default: "Farm-to-Roaster Traceability" }
              - { label: "Квадрат 3 (БГ)", name: "stat3BG", widget: "string", default: "Проследимост Ферма до пекар" }
              - { label: "Квадрат 4 (EN)", name: "stat4EN", widget: "string", default: "Precision Roasting" }
              - { label: "Квадрат 4 (БГ)", name: "stat4BG", widget: "string", default: "Прецизно Изпичане" }

          # PROCESS
          - label: "⚙️ Процес (4 стъпки)"
            name: "process"
            widget: "object"
            fields:
              - { label: "Въвеждащ текст (EN)", name: "bodyEN", widget: "text", default: "Quality green coffee, roasted to preserve and express its natural flavours — that's the whole process." }
              - { label: "Въвеждащ текст (БГ)", name: "bodyBG", widget: "text", default: "Качествено зелено кафе, изпечено по начин запазващ и изразяващ вкуса му — това е целият процес." }
              - { label: "Стъпка 1 заглавие (EN)", name: "step1TitleEN", widget: "string", default: "Selection" }
              - { label: "Стъпка 1 заглавие (БГ)", name: "step1TitleBG", widget: "string", default: "Подбор" }
              - { label: "Стъпка 1 текст (EN)", name: "step1DescEN", widget: "text", default: "We source green coffee with traceable origin and interesting flavour profiles." }
              - { label: "Стъпка 1 текст (БГ)", name: "step1DescBG", widget: "text", default: "Подбираме зелено кафе с проследим произход, с интересен вкусов профил." }
              - { label: "Стъпка 2 заглавие (EN)", name: "step2TitleEN", widget: "string", default: "Processing" }
              - { label: "Стъпка 2 заглавие (БГ)", name: "step2TitleBG", widget: "string", default: "Обработка" }
              - { label: "Стъпка 2 текст (EN)", name: "step2DescEN", widget: "text", default: "After your order, each coffee is roasted in a way that brings out its natural flavour." }
              - { label: "Стъпка 2 текст (БГ)", name: "step2DescBG", widget: "text", default: "След поръчка изпичаме всяко кафе по начин, който да подчертае вкуса му." }
              - { label: "Стъпка 3 заглавие (EN)", name: "step3TitleEN", widget: "string", default: "Roasting" }
              - { label: "Стъпка 3 заглавие (БГ)", name: "step3TitleBG", widget: "string", default: "Печене" }
              - { label: "Стъпка 3 текст (EN)", name: "step3DescEN", widget: "text", default: "We aim for balanced sweetness and expressive taste notes." }
              - { label: "Стъпка 3 текст (БГ)", name: "step3DescBG", widget: "text", default: "Целим балансирана сладост и изразени вкусове." }
              - { label: "Стъпка 4 заглавие (EN)", name: "step4TitleEN", widget: "string", default: "Delivery" }
              - { label: "Стъпка 4 заглавие (БГ)", name: "step4TitleBG", widget: "string", default: "Доставка" }
              - { label: "Стъпка 4 текст (EN)", name: "step4DescEN", widget: "text", default: "Your coffee isn't sitting on a shelf for years — it's roasted shortly after your order." }
              - { label: "Стъпка 4 текст (БГ)", name: "step4DescBG", widget: "text", default: "Кафето ви не е стояло на рафта в магазина с години — пече се скоро след поръчката ви." }

          # FEATURES
          - label: "⬡ Характеристики (4 блока)"
            name: "features"
            widget: "object"
            fields:
              - { label: "Блок 1 заглавие (EN)", name: "feat1TitleEN", widget: "string", default: "Direct Trade" }
              - { label: "Блок 1 заглавие (БГ)", name: "feat1TitleBG", widget: "string", default: "Директен произход" }
              - { label: "Блок 1 текст (EN)", name: "feat1DescEN", widget: "text", default: "We source directly from producers with verified traceability to specific farms." }
              - { label: "Блок 1 текст (БГ)", name: "feat1DescBG", widget: "text", default: "Подбираме директно от производители с проследим произход до конкретна ферма." }
              - { label: "Блок 2 заглавие (EN)", name: "feat2TitleEN", widget: "string", default: "Roasted Fresh" }
              - { label: "Блок 2 заглавие (БГ)", name: "feat2TitleBG", widget: "string", default: "Прясно препечено" }
              - { label: "Блок 2 текст (EN)", name: "feat2DescEN", widget: "text", default: "Every batch is roasted to order and ships within 24 hours of your purchase." }
              - { label: "Блок 2 текст (БГ)", name: "feat2DescBG", widget: "text", default: "Всяка партида се пече по поръчка и се изпраща в рамките на 24 часа." }
              - { label: "Блок 3 заглавие (EN)", name: "feat3TitleEN", widget: "string", default: "Traceable Origin" }
              - { label: "Блок 3 заглавие (БГ)", name: "feat3TitleBG", widget: "string", default: "Проследим произход" }
              - { label: "Блок 3 текст (EN)", name: "feat3DescEN", widget: "text", default: "Full transparency — every bag is traceable to its specific farm and harvest." }
              - { label: "Блок 3 текст (БГ)", name: "feat3DescBG", widget: "text", default: "Пълна прозрачност — всяка торбичка е проследима до конкретна ферма и реколта." }
              - { label: "Блок 4 заглавие (EN)", name: "feat4TitleEN", widget: "string", default: "Free Shipping" }
              - { label: "Блок 4 заглавие (БГ)", name: "feat4TitleBG", widget: "string", default: "Безплатна доставка" }
              - { label: "Блок 4 текст (EN)", name: "feat4DescEN", widget: "text", default: "Complimentary shipping on all orders over €35. No codes required." }
              - { label: "Блок 4 текст (БГ)", name: "feat4DescBG", widget: "text", default: "Безплатна доставка за всички поръчки над €35. Без кодове." }

          # SUBSCRIBE
          - label: "📧 Абонамент секция"
            name: "subscribe"
            widget: "object"
            fields:
              - { label: "Малък надпис (EN)", name: "labelEN", widget: "string", default: "Never Run Out" }
              - { label: "Малък надпис (БГ)", name: "labelBG", widget: "string", default: "Никога без кафе" }
              - { label: "Описание (EN)", name: "descEN", widget: "text", default: "Subscribe and save 15% on every order. Choose your cadence — weekly, bi-weekly, or monthly. Pause or cancel anytime." }
              - { label: "Описание (БГ)", name: "descBG", widget: "text", default: "Абонирайте се и спестете 15% от всяка поръчка. Седмично, двуседмично или месечно. Спирайте по всяко време." }

          # FOOTER
          - label: "🦶 Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Tagline (EN)", name: "taglineEN", widget: "text", default: "Specialty coffee with traceable single-farm origin. Roasted with obsession. Delivered with care." }
              - { label: "Tagline (БГ)", name: "taglineBG", widget: "text", default: "Специалти кафе с проследим произход до конкретни ферми. Препечено с обсесия. Доставено с грижа." }
              - { label: "Copyright (EN)", name: "copyEN", widget: "string", default: "© 2024 420 Beans. All rights reserved." }
              - { label: "Copyright (БГ)", name: "copyBG", widget: "string", default: "© 2024 420 Beans. Всички права запазени." }

  # ── НАСТРОЙКИ ─────────────────────────────────────────────────────
  - name: "settings"
    label: "⚙️ Настройки"
    files:
      - name: "site_settings"
        label: "Основни настройки"
        file: "_data/settings.json"
        fields:
          - { label: "Stripe Publishable Key", name: "stripePublishableKey", widget: "string", hint: "Започва с pk_live_ или pk_test_" }
          - { label: "Имейл за контакт", name: "contactEmail", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagramUrl", widget: "string", required: false }
